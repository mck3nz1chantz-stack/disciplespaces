<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1e3a2f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Spaces" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta
      name="description"
      content="DiscipleSpaces — private small-group discipleship. Spaces, sessions, offline KJV, and manual sharing. Notes stay on your device."
    />
    <title>DiscipleSpaces</title>
    <!-- Apply theme before paint to avoid flash (mirrors src/lib/theme.ts) -->
    <script>
      (function () {
        try {
          var key = "ds-theme-v1";
          var pref = localStorage.getItem(key) || "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.dataset.theme = "dark";
            document.documentElement.style.colorScheme = "dark";
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#0c1210");
          } else {
            document.documentElement.dataset.theme = "light";
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
    <!-- Optional webfonts (cached by SW when available); Georgia/system fallback when offline -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
